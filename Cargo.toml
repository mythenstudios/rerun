[workspace]
resolver = "3"
members = ["crates/*"]
# The Tauri app joins the workspace in phase 5 (see docs/01-architecture.md).
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Mythen Studios"]
# Code: GPL-3.0-or-later. Topos/packages (data) will be licensed separately.
license = "GPL-3.0-or-later"
repository = "https://github.com/mythenstudios/rerun"
publish = false

[workspace.dependencies]
rerun-core = { path = "crates/rerun-core" }
rerun-proto = { path = "crates/rerun-proto" }

thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# Exe hashes (ADR 0014): same RustCrypto project and digest stack as sha2.
sha1 = { version = "0.11.0", default-features = false }
# Without `color` (anstream would call SetConsoleMode on the shared console and read colour
# variables) and without `wrap_help` (terminal width), ADR 0016.
clap = { version = "4.6.7", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
# Win32/NT bindings, features chosen per crate (ADR 0008).
windows-sys = "0.61.2"
# Ed25519 for the signed index (ADR 0024): pure Rust, MIT, no dependencies without default
# features (no `random`, `pem`, `x25519`); verification in rerun-core, signing in the workbench.
# Pinned exactly: every binary that verifies (rerun, later the helper) decides edge cases alike.
ed25519-compact = { version = "=2.6.1", default-features = false }
# Inflate for package archives (ADR 0025 part 2, P4-7): raw DEFLATE only; the zip, gzip and tar
# readers around it are Rerun's own (pkg::archive). Pure Rust (`#![forbid(unsafe_code)]`), MIT OR
# Zlib OR Apache-2.0, one dependency (adler2); the default `with-alloc` only. Pinned exactly: it
# decides how untrusted archives decode.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
# The seed of the index key in `rerun-workbench key generate` (OS RNG; workbench only).
getrandom = "0.3.4"

# Dev dependencies only (schema validation in tests) and the curator tool rerun-workbench (YAML
# into the signed index, never shipped), see ADR 0005 and ADR 0024.
jsonschema = { version = "0.60.2", default-features = false }
serde-saphyr = "2.0.0"

[workspace.lints.rust]
# Exceptions only via #![allow(unsafe_code)] with a reason: sys::win, rerun-launch, rerun-cpu.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unwrap_used = "deny"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
cast_possible_truncation = "warn"
disallowed_methods = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.release.package.rerun-launch]
opt-level = "s"

[profile.release.package.rerun-cpu]
opt-level = "s"

# CI test profile (docs/09-testing.md): the dev profile with optimisation, so the heavy crash
# matrices run several times faster. Debug assertions and overflow checks stay on (inherited).
[profile.ci]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
