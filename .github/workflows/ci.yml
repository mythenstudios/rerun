name: CI

on:
  # Documentation-only changes run no CI (Windows minutes count twice on a private repo).
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# Actions are pinned by commit SHA (docs/06-security.md). Comment = release tag.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check

  deny:
    name: cargo-deny
    # The action is a Docker container and only runs on Linux. deny.toml still evaluates
    # the Windows dependencies via [graph] targets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  windows:
    name: clippy + test (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The cache key hashes Cargo.lock and dependency sections, not [profile.*]: bump the
          # suffix when a profile changes, otherwise an exact hit never saves the new artifacts.
          key: windows-p2
      - name: clippy (x64, all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: clippy (i686, without workspace tests)
        run: cargo clippy -p rerun-cpu -p rerun-proto -p rerun-launch --target i686-pc-windows-msvc --locked -- -D warnings
      - name: rerun-launch - size < 1 MiB
        # Built with -p on purpose: feature unification in the workspace would pull in rerun-proto/serde.
        # Before the tests: the hardening test checks this release binary too (RERUN_RELEASE_LAUNCH_EXE).
        run: |
          cargo build -p rerun-launch --release --locked
          size=$(stat -c %s target/release/rerun-launch.exe)
          echo "rerun-launch.exe: $size bytes"
          if [ "$size" -ge 1048576 ]; then
            echo "::error::rerun-launch.exe is $size bytes (limit 1 MiB)"
            exit 1
          fi
      - name: rerun - release build
        # Built with -p (no dev-dependencies, so without rerun-core/fake), before the tests: the
        # hardening test checks this release binary too (RERUN_RELEASE_CLI_EXE).
        run: cargo build -p rerun-cli --release --locked
      - name: test (incl. schema validation of topos/ and packages/)
        # Opt-in for the machine-wide fs contract fixtures (mount point, subst, 8.3 names) and
        # the elevated run; only honoured together with RUNNER_ENVIRONMENT=github-hosted
        # (docs/09-testing.md, safeguard 4).
        env:
          RERUN_FS_MACHINE_FIXTURES: "1"
          # The release shim built above, checked by crates/rerun-launch/tests/hardening.rs
          # (required on GitHub-hosted runners, skipped locally when unset).
          RERUN_RELEASE_LAUNCH_EXE: ${{ github.workspace }}/target/release/rerun-launch.exe
          # The release rerun.exe built above, checked by crates/rerun-cli/tests/hardening.rs.
          RERUN_RELEASE_CLI_EXE: ${{ github.workspace }}/target/release/rerun.exe
        # --profile ci: dev with optimisation (Cargo.toml), debug assertions stay on (docs/09-testing.md).
        run: cargo test --workspace --all-features --locked --profile ci
      - name: rerun-core fake and test-key features never in shipped binaries
        # ADR 0007: the in-memory fake and its TOCTOU hooks stay out of release builds.
        # ADR 0024: the published test key of the signed index is never trusted by a release build.
        # Features do not depend on the profile; -e normal skips dev-dependencies.
        run: |
          for f in fake test-key; do
            if ! cargo tree -p rerun-core --features "$f" -e features -i rerun-core --locked | grep -q "feature \"$f\""; then
              echo "::error::sanity check failed: the grep pattern no longer matches cargo tree output ($f)"
              exit 1
            fi
            for p in rerun-cli; do  # add the Tauri app crate in phase 4
              if cargo tree -p "$p" -e normal,build,features -i rerun-core --locked | grep -q "feature \"$f\""; then
                echo "::error::$p enables rerun-core/$f"
                exit 1
              fi
            done
          done
      - name: clap without the color feature
        # ADR 0016: clap's `color` feature (anstream) calls SetConsoleMode on the console the
        # parent shell shares and reads colour variables. Risk: feature unification once another
        # crate depends on clap with default features.
        # Checked for rerun-cli alone and for the whole workspace.
        run: |
          for scope in "-p rerun-cli" "--workspace"; do
            tree=$(cargo tree $scope -e normal,features -i clap_builder --locked)
            if ! grep -q 'clap_builder feature "std"' <<<"$tree"; then
              echo "::error::sanity check failed ($scope): the grep pattern no longer matches cargo tree output"
              exit 1
            fi
            if grep -q 'feature "color"' <<<"$tree"; then
              echo "::error::clap is built with the color feature ($scope)"
              exit 1
            fi
          done
      - name: phase 0 acceptance - rerun --help
        run: cargo run -p rerun-cli --locked --profile ci -- --help
      - name: rerun-launch - allowed dependencies
        run: |
          deps=$(cargo tree -p rerun-launch -e normal --depth 1 --prefix none --locked \
            | tail -n +2 | awk '{print $1}' | sort -u | grep -v -x -E 'windows-sys|rerun-proto' || true)
          if [ -n "$deps" ]; then
            echo "::error::rerun-launch has disallowed dependencies: $deps"
            exit 1
          fi

  cpu:
    name: rerun-cpu.asi (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cpu-${{ matrix.target }}
      - name: Build
        run: cargo build -p rerun-cpu --release --target ${{ matrix.target }} --locked
      - name: Rename to rerun-cpu.asi (ADR 0006)
        run: |
          mkdir -p dist/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/rerun_cpu.dll dist/${{ matrix.arch }}/rerun-cpu.asi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rerun-cpu-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/rerun-cpu.asi
          if-no-files-found: error

  sandbox:
    # The Windows Sandbox suite (docs/09-testing.md) on a disposable runner: the `#[ignore]`
    # sandbox tests and the CLI round trips write the real HKCU and LocalAppData of the account
    # that runs them, which is fine on a throwaway VM. Locally the suite stays an optional
    # fallback (scripts/sandbox-test.wsb; Smart App Control blocks it on the developer machine).
    name: sandbox suite (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Its own key (the windows job builds with --profile ci, this one with the dev profile
          # of scripts/sandbox-launch.ps1, which stages the same binaries as the Sandbox gets).
          key: windows-sandbox-p1
      - name: build the sandbox binaries (rerun-core tests, rerun.exe, rerun-launch.exe)
        # Visible here; scripts/sandbox-launch.ps1 -StageOnly (run by ci-sandbox.ps1) repeats
        # exactly these builds, which are then up to date, and stages the results.
        run: |
          cargo test -p rerun-core --lib --no-run --locked
          cargo build -p rerun-cli --release --locked
          cargo build -p rerun-launch --release --locked
      - name: sandbox suite (non-elevated as a new standard user, then elevated)
        # Windows PowerShell 5.1, like the Sandbox. Creates the local user `rerunci`, writes the
        # real HKCU of that user and of the runner account (disposable VM).
        shell: powershell
        run: .\scripts\ci-sandbox.ps1
      - name: upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-suite
          path: C:\sandbox\out
          if-no-files-found: warn
