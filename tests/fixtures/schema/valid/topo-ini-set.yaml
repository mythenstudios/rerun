format: 1
id: schema-fixture
title: "Fixture"
status: draft
rev: 1
match:
  exes:
    - { path: "game.exe", sha1: "0000000000000000000000000000000000000000", api: d3d9 }
issues:
  - id: issue
    title: "Issue"
    variants:
      - id: v
        status: unverified
        kind: fix
        steps:
          - ini_set:
              file: 'cfg/Game.INI'
              values:
                - { section: Display, key: Width, value: "1920" }
                - { section: 'Engine.Settings 2', key: r.Shadow-Quality_1, value: 'a = b' }
          - ini_set: { file: game.ini, values: [ { section: S, key: k, value: "1" } ] }
