# Valid: an INI file in the game's folder below Documents (P4-12)
format: 1
id: schema-fixture
title: "Fixture"
status: draft
rev: 1
match:
  exes:
    - { path: "game.exe", sha1: "0000000000000000000000000000000000000000", api: d3d9 }
user_data:
  documents: 'My Games\Fallout3'
issues:
  - id: issue
    title: "Issue"
    variants:
      - id: v
        status: unverified
        kind: fix
        steps:
          - ini_set: { root: user_data, file: 'FALLOUT.INI', values: [ { section: General, key: iNumHWThreads, value: "2" } ] }
