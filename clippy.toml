allow-unwrap-in-tests = true
allow-expect-in-tests = true

# System access only through rerun_core::sys (ADR 0004); roots only through
# rerun_core::policy::root (ADR 0007). Exceptions via
# #[expect(clippy::disallowed_methods, reason = "...")] so a stale exception warns:
# policy::root::open_abs, sys::snapshot::snapshot, contract and test code, sys::win and
# rerun-launch. NtCreateFile has exactly two exceptions, in sys::win::nt.
disallowed-methods = [
  { path = "std::fs::write", reason = "filesystem access only through sys::Fs" },
  { path = "std::fs::remove_file", reason = "filesystem access only through sys::Fs" },
