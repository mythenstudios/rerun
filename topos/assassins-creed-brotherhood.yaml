      - id: exclude-cpu0
        status: unverified     # one Steam thread, repeated by PCGW; same fix as AC II (verified there on the dev PC), not tried on this game
        kind: fix
        steps:
          - cpu: { exclude_first: thread, mode: hard }
        sources:
          - { type: steam-thread, url: "https://steamcommunity.com/app/48190/discussions/0/1727575977550197630/" }
          - { type: pcgw, url: "https://www.pcgamingwiki.com/wiki/Assassin's_Creed:_Brotherhood#In-game_stuttering,_freezing_issues" }

