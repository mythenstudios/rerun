  start: "TODO"   # Steam's launch entry: observe, never guess; chain and method are not observed either (game never started; Ubisoft Connect is involved)
# AC.ini lies in Documents\Assassin's Creed Syndicate (PCGW "Game data"). The game has never been started on the
# dev machine, so the folder and file do not exist yet; ini_set needs both (it never creates them).
user_data:
  documents: "Assassin's Creed Syndicate"
issues:
  - id: title-screen-freeze
    title: "Freeze on the title screen after pressing a key (exclusive fullscreen above 60 Hz)"
    # No `when`: the source reports Windows 11 (24H2) but PCGW states the cause for any high refresh rate; left empty.
    when: {}
    variants:
      - id: refresh-rate-60
        status: unverified     # a single Steam thread report, repeated by PCGW
        kind: fix
        steps:
          - ini_set:
              file: "AC.ini"
              root: user_data
              values:
                - { section: Graphics, key: RefreshRate, value: "60" }
        tradeoffs: ["The game is limited to 60 Hz in exclusive fullscreen"]
        sources:
          - { type: pcgw, url: "https://www.pcgamingwiki.com/wiki/Assassin's_Creed_Syndicate#Game_Freezes_on_Main_Title_Screen" }
          - { type: steam-thread, url: "https://steamcommunity.com/app/368500/discussions/0/601892852260193436/" }
      - id: borderless
        status: unverified     # a single user check named by PCGW
        kind: fix
        steps:
          - ini_set:
              file: "AC.ini"
              root: user_data
              values:
                - { section: Graphics, key: WindowMode, value: "1" }
        tradeoffs: ["Borderless fullscreen instead of exclusive fullscreen"]
        sources:
          - { type: pcgw, url: "https://www.pcgamingwiki.com/wiki/Assassin's_Creed_Syndicate#Game_Freezes_on_Main_Title_Screen" }
