format: 1
id: "assassins-creed-ii"
title: "Assassin's Creed II"
status: "active"
rev: 1
tested_on: [x64]
match:
  steam_appid: 33230
  exes:
    # hashes from an unmodified Steam copy
    - { path: "AssassinsCreedIIGame.exe", sha1: "FDFDD9B80641DFE9C4AB6A63BD5247A2BDD2BE26", sha256: "A4BA454B0E2A9190A42DB631574B694CC0DBDCEC750106C1B0364B70A6E4D17E", api: "d3d9" }
    # UPlayBrowser.exe (also in the folder) is the Ubisoft browser helper, not the game: left out
# PCGW API: Direct3D 9; OpenGL; 32-bit exe yes, 64-bit exe no
# TODO: PCGW: field of view hackable - https://www.pcgamingwiki.com/wiki/Assassin's_Creed_II#Video
# TODO: PCGW: 120 FPS hackable - https://www.pcgamingwiki.com/wiki/Assassin's_Creed_II#Video
# Launch observed on the dev PC (P4-13 S1, 2026-11-11): steam.exe starts AssassinsCreedIIGame.exe, which ends after
# a few seconds and starts again through Ubisoft Connect (UbisoftGameLauncher.exe is the parent of
# the second AssassinsCreedIIGame.exe): watch with start = the game itself, like AC Black Flag Resynced.
launch:
  chain: [steam, upc]
  method: watch
  start: "AssassinsCreedIIGame.exe"
issues:
  - id: vsync-stutter
    title: "Stuttering or screen tearing with Vsync on or off"
    # No `when`: the source limits the fix to quad core and above, but cpu.threads counts logical processors,
    # so a dual core with SMT would pass a threshold of 4. Left empty until the format can say "cores".
    when: {}
    variants:
      - id: exclude-cpu0
        status: verified       # 2026-11-11, Ryzen 9 5950X (32 LP) / RX 9070 XT / Windows 11 26300, Vsync on at 120 Hz: small stutters without Rerun, noticeably smoother with the plan applied (rerun-launch watch through Ubisoft Connect, 0xFFFFFFFE); one tester's judgement, no frame-time log yet (one with and without the fix before A6, else unverified); revert bit-identical (docs/09)
        kind: fix
        steps:
          - cpu: { exclude_first: thread, mode: hard }
        sources:
          - { type: pcgw, url: "https://www.pcgamingwiki.com/wiki/Assassin's_Creed_II#Stuttering_and%2For_screen_tearing_with_Vsync_on_or_off" }
