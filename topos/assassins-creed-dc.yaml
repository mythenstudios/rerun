# SHA-1 from the EaglePatch README; SHA-256 from an unmodified Steam copy.
format: 1
id: assassins-creed-dc
title: "Assassin's Creed: Director's Cut Edition"
status: active
rev: 1
tested_on: [x64]

match:
  steam_appid: 15100          # confirmed by the dev scan (app 15100 installed in that folder)
  exes:
    - { path: "AssassinsCreed_Dx9.exe",  sha1: "A9EA476E70F076709CCA59A802E26EC894432120", sha256: "2FA8D50C60398CC249C6D908DE46B15F48E445DD0C605B5956E94FA2F445A713", api: d3d9 }
    - { path: "AssassinsCreed_Dx10.exe", sha1: "601475FD5EFA02BBAE80D1C06DFA25A0A1E7FD2F", sha256: "576A04841C37BE5A819974ABD59EA3ECD818F0BC36ACAB71C62EE0313DCA0129", api: d3d10 }

# Launch observed on the dev PC (P4-13 S1, 2026-11-11): steam.exe starts AssassinsCreed_Game.exe (a D3D detector, no
# Ubisoft Connect), which runs Detection\Detection.exe and then starts AssassinsCreed_Dx10.exe without a choice dialog.
# Both fixes below were reproduced by hand on the dev PC (5950X, 32 logical processors, RX 9070 XT, Windows 11
# 26300, game unmodified) through rerun-launch (scripts/dev-launch-profile.ps1, profile direct on
# AssassinsCreed_Game.exe); Rerun apply is not done yet, so both stay unverified. Detection.exe crashes in
# systemtests_rd.tst on every start, also inside an 8-thread job; the game starts anyway, so that is not an issue.
# fallback inproc stays: report_cores (phase 6) is the alternative if a job limit ever fails to reach Dx10.exe.
launch:
  chain: [steam]
  method: auto
  start: "AssassinsCreed_Game.exe"
  fallback: inproc

issues:
  # steam-input variant (steam_input: enable) waits: no source yet, and a variant needs one.
  - id: controller
    title: "Modern controllers are not detected and there is no hotplug"
    when: {}
    variants:
      - id: eaglepatch
        status: unverified      # single source (the author's README), not tested by us
        kind: fix
        # Loader: ultimate-asi-loader stays at 10.0.2; the README names v4.68 but no source says the patch needs it.
        # Untested idea, NOT a claim: the README lists "Removed telemetry", which might also bear on the Ubisoft
        # intro crash (issue online-services); check this when the variant is tested.
        steps:
          - { package: ultimate-asi-loader }
          - { package: eaglepatch-ac1 }
        tradeoffs:
          - "Removes DInput controller support (the INI key DisableXInputPatch=1 re-enables it)"
          - "The in-game controls layout has no effect; set KeyboardLayout in the INI instead"
        sources:
          - { type: repo, url: "https://github.com/Sergeanur/EaglePatch" }

  - id: crash-many-threads
    title: "Game crashes about 2 s after start on a PC with more than 8 logical processors"
    when:
      cpu.threads: { gt: 8 }
    variants:
      - id: limit-8-threads
        status: verified        # 2026-11-11, Ryzen 9 5950X (32 LP) / RX 9070 XT / Windows 11 26300: without a limit AssassinsCreed_Dx10.exe crashes ~2.5 s after its start (0xc0000005); with the plan applied (rerun-launch direct, 8 threads) it passes that point and reaches the Ubisoft intro (and the menu when offline, issue below); revert bit-identical (docs/09)
        kind: fix
        # Exactly the rule the dev PC test wrote (the script's fixed profile: prefer performance, one L3,
        # no SMT, hard, 8 threads). The sources only name "8 processors"; the other fields are not sourced.
        steps: [{ cpu: { max_threads: 8, prefer: performance, single_l3: true, smt: false, mode: hard } }]
        tradeoffs:
          - "The game uses at most 8 logical processors (one CCD, no SMT thread pairs); it is a 2008 title, so this costs little"
        sources:
          - { type: steam-thread, url: "https://steamcommunity.com/app/15100/discussions/0/3369279631097585577/" }
          - { type: steam-thread, url: "https://steamcommunity.com/app/15100/discussions/0/5299051083531295561/" }
          - { type: steam-guide, url: "https://steamcommunity.com/sharedfiles/filedetails/?id=3276044556" }

  - id: online-services
    title: "Game crashes at the Ubisoft logo intro (shut-down online services)"
    when: {}
    variants:
      - id: block-network
        status: unverified      # the problem is reproduced on the dev PC (offline: menu reached), but these rules did NOT help there: 2026-11-11, with both rules applied and active (and 8 threads) the game still crashed at the intro (0x80000003) while online; the rules were added and removed bit-identically (docs/09). A blocked connection is not the same as no network for the game; EaglePatch (P4-13b) removes the server request instead
        kind: fix
        steps:
          - { firewall_rule: { exe: "AssassinsCreed_Dx10.exe", direction: out } }
          - { firewall_rule: { exe: "AssassinsCreed_Dx9.exe",  direction: out } }
        tradeoffs:
          - "The game has no network access at all; its online features are shut down anyway"
        sources:
          - { type: pcgw, url: "https://www.pcgamingwiki.com/wiki/Assassin's_Creed#Crashes_to_desktop_at_Ubisoft_logo_intro" }
          - { type: steam-thread, url: "https://steamcommunity.com/app/15100/discussions/0/540738052667940429/" }

tips:
  launch_options: []
  notes: []

links:
  pcgw: "Assassin's_Creed"
