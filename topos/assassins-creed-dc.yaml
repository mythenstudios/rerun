# SHA-1 from the EaglePatch README; SHA-256 from an unmodified Steam copy.
format: 1
id: assassins-creed-dc
title: "Assassin's Creed: Director's Cut Edition"
status: active
rev: 2
tested_on: [x64]

match:
  steam_appid: 15100          # confirmed by the dev scan (app 15100 installed in that folder)
  exes:
    # Dx10 first: the first matched entry is the plan's main executable, and the launch starts Dx10.exe (below).
    - { path: "AssassinsCreed_Dx10.exe", sha1: "601475FD5EFA02BBAE80D1C06DFA25A0A1E7FD2F", sha256: "576A04841C37BE5A819974ABD59EA3ECD818F0BC36ACAB71C62EE0313DCA0129", api: d3d10 }
    - { path: "AssassinsCreed_Dx9.exe",  sha1: "A9EA476E70F076709CCA59A802E26EC894432120", sha256: "2FA8D50C60398CC249C6D908DE46B15F48E445DD0C605B5956E94FA2F445A713", api: d3d9 }

# Launch observed on the dev PC (P4-13 S1, 2026-11-11): steam.exe starts AssassinsCreed_Game.exe (a D3D detector, no
# Ubisoft Connect), which runs Detection\Detection.exe and then starts AssassinsCreed_Dx10.exe without a choice dialog.
# Both problems below were reproduced by hand on the dev PC (5950X, 32 logical processors, RX 9070 XT, Windows 11
# 26300, game unmodified) through rerun-launch (scripts/dev-launch-profile.ps1, profile direct on
# AssassinsCreed_Game.exe); the fixes were then applied by Rerun and reverted in S1 and S2 (status per variant
# below, docs/09). Detection.exe crashes in
# systemtests_rd.tst on every start, also inside an 8-thread job; the game starts anyway, so that is not an issue.
# fallback inproc stays: report_cores (phase 6) is the alternative if a job limit ever fails to reach Dx10.exe.
launch:
  chain: [steam]
  method: auto
  start: "AssassinsCreed_Game.exe"
  fallback: inproc

# Game option graphics-api (ADR 0032, P5-OE O-3), READY BUT NOT ENABLED. Its values carry `start`, which the loader
# accepts only in a draft until catalog::check::OPTION_LAUNCH_REVIEWED opens (closed today): an active Topo with it
# is refused, and a draft never reaches the signed index. The gate commit un-comments this block (check the status
# label then: both values stay unverified until the dev PC test passes, docs/09 "run instead of Steam's entry").
# Both exes sit next to launch.start and have a sha256 in match.exes (the loader needs both). Facts behind it:
# Steam starts AssassinsCreed_Game.exe, a Direct3D detector that picks the Dx10 or Dx9 build (PCGW, availability
# note); the game has no in-game switch; DX10.1 was removed by patch 1.02 (PCGW, API); the known per-exe
# differences are small (TweakGuides: DX10 slightly better shadows/bloom/multisampling, DX9 about as fast); a Steam
# thread reports the overlay's browser stays black with the Dx10 exe and works when the Dx9 exe is started
# (the launch option path of Dx9.exe). EaglePatchAC1 lists both exes as supported (its README; one line is
# "[DX10 only]"), so the option fits next to the eaglepatch variants. Recommendation: none; Dx10 stays Steam's
# default (the "unchanged" value), Dx9 is offered for the overlay and for users who prefer it.
#
# options:
#   - id: graphics-api
#     title: "Graphics API"
#     sources:
#       - { type: pcgw, url: "https://www.pcgamingwiki.com/wiki/Assassin%27s_Creed#API" }
#       - { type: steam-thread, url: "https://steamcommunity.com/app/15100/discussions/0/3086634196678063390" }
#     values:
#       - id: dx9
#         title: "DirectX 9"
#         status: unverified      # until the dev PC test (docs/09, P5-OE O-3)
#         steps: [{ start: "AssassinsCreed_Dx9.exe" }]
#       - id: dx10
#         title: "DirectX 10"
#         status: unverified
#         steps: [{ start: "AssassinsCreed_Dx10.exe" }]

issues:
  # steam-input variant (steam_input: enable) waits: no source yet, and a variant needs one.
  - id: controller
    title: "Modern controllers are not detected and there is no hotplug"
    when: {}
    variants:
      - id: eaglepatch
        status: unverified      # single source (the author's README), not tested by us
        kind: fix
        # Loader: ultimate-asi-loader stays at 10.0.2; the README names v4.68 but no source says the patch needs it.
        # The same steps fix the Ubisoft intro crash (variant online-services/eaglepatch, verified 2026-11-11);
        # pick only one of the two variants. The controller part itself is not tested by us.
        steps:
          - { package: ultimate-asi-loader }
          - { package: eaglepatch-ac1 }
        tradeoffs:
          - "Removes DInput controller support (the INI key DisableXInputPatch=1 re-enables it)"
          - "The in-game controls layout has no effect; set KeyboardLayout in the INI instead"
        sources:
          - { type: repo, url: "https://github.com/Sergeanur/EaglePatch" }

  - id: crash-many-threads
    title: "Game crashes about 2 s after start on a PC with more than 8 logical processors"
    when:
      cpu.threads: { gt: 8 }
    variants:
      - id: limit-8-threads
        status: verified        # 2026-11-11, Ryzen 9 5950X (32 LP) / RX 9070 XT / Windows 11 26300: without a limit AssassinsCreed_Dx10.exe crashes ~2.5 s after its start (0xc0000005); with the plan applied (rerun-launch direct, 8 threads) it passes that point and reaches the Ubisoft intro (and the menu when offline, issue below); revert bit-identical (docs/09)
        kind: fix
        # Exactly the rule the dev PC test wrote (the script's fixed profile: prefer performance, one L3,
        # no SMT, hard, 8 threads). The sources only name "8 processors"; the other fields are not sourced.
        steps: [{ cpu: { max_threads: 8, prefer: performance, single_l3: true, smt: false, mode: hard } }]
        tradeoffs:
          - "The game uses at most 8 logical processors (one CCD, no SMT thread pairs); it is a 2008 title, so this costs little"
        sources:
          - { type: steam-thread, url: "https://steamcommunity.com/app/15100/discussions/0/3369279631097585577/" }
          - { type: steam-thread, url: "https://steamcommunity.com/app/15100/discussions/0/5299051083531295561/" }
          - { type: steam-guide, url: "https://steamcommunity.com/sharedfiles/filedetails/?id=3276044556" }

  - id: online-services
    title: "Game crashes at the Ubisoft logo intro (shut-down online services)"
    when: {}
    variants:
      - id: eaglepatch
        status: verified        # 2026-11-11, Ryzen 9 5950X (32 LP) / RX 9070 XT / Windows 11 26300, Smart App Control on: online, with only limit-8-threads the game crashed at the intro (0x80000003); with ultimate-asi-loader 10.0.2 + eaglepatch-ac1 1.1 applied (and limit-8-threads) it passed the intro and ran in game for minutes; Smart App Control loaded the DLLs (no CodeIntegrity event); revert bit-identical (docs/09)
        kind: fix
        # EaglePatch's README lists "Removed telemetry"; PCGW names it for the requests to the shut-down server.
        steps:
          - { package: ultimate-asi-loader }
          - { package: eaglepatch-ac1 }
        tradeoffs:
          - "Removes DInput controller support (the INI key DisableXInputPatch=1 re-enables it)"
          - "The in-game controls layout has no effect; set KeyboardLayout in the INI instead"
        sources:
          - { type: repo, url: "https://github.com/Sergeanur/EaglePatch" }
          - { type: pcgw, url: "https://www.pcgamingwiki.com/wiki/Assassin%27s_Creed#Game_regularly_freezes_for_a_few_seconds" }
      # Tried and dropped (no variant): outbound firewall rules for AssassinsCreed_Dx10.exe and _Dx9.exe, suggested by
      # PCGW (https://www.pcgamingwiki.com/wiki/Assassin's_Creed#Crashes_to_desktop_at_Ubisoft_logo_intro) and a Steam thread
      # (https://steamcommunity.com/app/15100/discussions/0/540738052667940429/). Dev PC test 2026-11-11 (5950X / RX 9070 XT /
      # Windows 11 26300, with limit-8-threads): with both rules applied and active the game still crashed at the intro
      # (0x80000003) while online; only offline reached the menu. A blocked connection is not the same as no network for the
      # game. Rules were added and removed bit-identically (docs/09). Firewall rules stay for games that really need them.

tips:
  launch_options: []
  notes:
    # Manual workarounds for experienced users; Rerun does not apply them (system-wide or a changed exe).
    - text: "Manual, not done by Rerun: the game can be stopped from contacting the shut-down Ubisoft server by overwriting the host name gconnect.ubi.com in AssassinsCreed_Dx9.exe or AssassinsCreed_Dx10.exe with zero bytes in a hex editor. Keep a copy of the original exe: a changed exe no longer matches EaglePatch's supported builds or this Topo, and Smart App Control may block it. Steam's 'Verify integrity of game files' restores the original."
      source: { type: pcgw, url: "https://www.pcgamingwiki.com/wiki/Assassin%27s_Creed#Game_regularly_freezes_for_a_few_seconds" }
    # TODO note: hosts entries for gconnect.ubi.com and uts.ubi.com (system-wide, admin) are reported in the GOG forum
    # (https://www.gog.com/forum/assassins_creed_directors_cut/ac_hangs); the source types have no forum type yet.

links:
  pcgw: "Assassin's_Creed"
