[package]
name = "rerun-cli"
description = "Command-line interface `rerun`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rerun"
path = "src/main.rs"

[dependencies]
rerun-core.workspace = true
clap.workspace = true

# In-process end-to-end tests against the fake system layer (ADR 0016), and the published test
# key of the signed index (ADR 0024). Never in the shipped build: CI checks that
# `-e normal,build` of rerun-cli enables neither `fake` nor `test-key`.
[dev-dependencies]
rerun-core = { workspace = true, features = ["fake", "test-key"] }
# The SHA-256 of a test archive (package_tests); the crate rerun-core already uses, no new crate.
sha2.workspace = true

[lints]
workspace = true
