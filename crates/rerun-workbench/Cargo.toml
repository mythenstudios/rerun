[package]
name = "rerun-workbench"
description = "Curator tool (signed index, Topo drafts from PCGamingWiki). Not shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Curator tool, never shipped (ADR 0024): YAML is parsed here (ADR 0005: serde-saphyr only in
# the workbench and tests), the index is signed here (ed25519-compact, the signing half of the
# crate rerun-core verifies with), and the key seed comes from the OS RNG (getrandom 0.3, already
# in the lock file through jsonschema; ed25519-compact's own `random` feature would add
# getrandom 0.4).
[features]
# `index sign-test`: signs an index with the published test key (ADR 0024 amendment P4-13), for
# the [DEV] test-key rerun.exe of scripts/dev-topo-roundtrip.ps1. rerun-core's compile_error!
# refuses it without debug assertions. No new dependency.
test-key = ["rerun-core/test-key"]

[dependencies]
rerun-core.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
ed25519-compact.workspace = true
getrandom.workspace = true

# The owner-only DACL of the private key file (src/acl.rs, ADR 0024): OpenProcessToken,
# GetTokenInformation(TokenUser), InitializeAcl, AddAccessAllowedAce, SetSecurityInfo and
# GetSecurityInfo on the file handle, LocalFree. Features of the existing dependency.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
jsonschema.workspace = true
# Tests sign with the published test key (ADR 0024); `draft` runs against FakeHttp (P4-14).
rerun-core = { workspace = true, features = ["test-key", "fake"] }

[lints]
workspace = true
