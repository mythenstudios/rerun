[package]
name = "rerun-core"
description = "Rerun core: detection, topo engine, primitives, journal, system layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# In-memory system layer and contract tests for tests in other crates.
fake = []

[dependencies]
rerun-proto = { workspace = true, features = ["serde"] }
thiserror.workspace = true
# Snapshot hashes and, with sha1, exe hashes (detect::exe::hash, ADR 0014).
sha2.workspace = true
sha1.workspace = true
# Topology fixtures; from phase 1 also profile and topo.
serde_json.workspace = true

# sys::win (ADR 0008): NT file APIs, final path, volume info, reparse data, AccessCheck;
# known folders (ADR 0009): SHGetKnownFolderPath, CoTaskMemFree, GetSystemWindowsDirectoryW;
# registry (ADR 0009): RegOpenCurrentUser, RegOpenKeyExW, RegEnumKeyExW, RegQueryInfoKeyW,
# NtQueryValueKey, NtEnumerateValueKey; CPU topology (ADR 0010): GetSystemCpuSetInformation,
# GetLogicalProcessorInformationEx (Win32_System_SystemInformation); DLL search path and the
# dxgi.dll load (ADR 0008, H2 and amendment): SetDefaultDllDirectories, LoadLibraryExW,
# GetProcAddress (Win32_System_LibraryLoader). DXGI itself is hand-written in sys::win::dxgi:
# windows-sys 0.61 has no DXGI feature.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_Registry",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
jsonschema.workspace = true
serde-saphyr.workspace = true

# Test only: lets sys::win::bans reference every banned windows-sys item (clippy.toml), so a
# dead ban entry fails clippy; the PE layout pin (detect::pe::layout, ADR 0013) reads the
# PE structures (Win32_System_Diagnostics_Debug, Win32_System_SystemServices,
# Win32_System_WindowsProgramming); the write contract's fixtures map a file as an image
# section (Win32_System_Memory: CreateFileMappingW, MapViewOfFile). Features of the
# existing dependency, no new crate.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Wdk_Graphics_Direct3D",
  "Wdk_System_SystemInformation",
  "Wdk_System_SystemServices",
  "Wdk_System_Threading",
  "Win32_Gaming",
  "Win32_System_ClrHosting",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Com_Urlmon",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Environment",
  "Win32_System_JobObjects",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
