[package]
name = "rerun-core"
description = "Rerun core: detection, topo engine, primitives, journal, system layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# In-memory system layer and contract tests for tests in other crates.
fake = []

[dependencies]
rerun-proto = { workspace = true, features = ["serde"] }
thiserror.workspace = true
# Snapshot hashes; from phase 1 also for exe hashes.
sha2.workspace = true
# Topology fixtures; from phase 1 also profile and topo.
serde_json.workspace = true

# sys::win (ADR 0008): NT file APIs, final path, volume info, reparse data, AccessCheck;
# known folders (ADR 0009): SHGetKnownFolderPath, CoTaskMemFree, GetSystemWindowsDirectoryW.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
jsonschema.workspace = true
serde-saphyr.workspace = true

# Test only: lets sys::win::bans reference every banned windows-sys item (clippy.toml), so a
# dead ban entry fails clippy; Win32_System_Registry for the test-only HKLM reader in
# sys::win::testfx (until sys::win has its registry). Features of the existing dependency,
# no new crate.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Wdk_System_SystemServices",
  "Win32_System_Environment",
  "Win32_System_Registry",
] }

[lints]
workspace = true
