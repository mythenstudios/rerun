[package]
name = "rerun-launch"
description = "Launch shim rerun-launch.exe. Allowed dependencies: windows-sys and rerun-proto."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only windows-sys and rerun-proto are allowed (checked by CI, ADR 0006). windows-sys with the
# features in use only: SetDefaultDllDirectories (Win32_System_LibraryLoader, ADR 0008, H2).
[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader"] }

# Test only: the hardening test reads the built shim with rerun_core::detect::pe (ADR 0013,
# "Hardening tests"). A dev-dependency never reaches the shipped binary (`cargo tree -e normal`,
# the size build uses -p without dev-dependencies).
[dev-dependencies]
rerun-core.workspace = true

[lints]
workspace = true
