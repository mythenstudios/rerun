# Static CRT: rerun-cpu.asi runs inside old game processes and rerun-launch.exe is started
# by Steam. Neither may depend on an installed VC++ redistributable (ADR 0006).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
