# cargo-deny: licenses, advisories, sources, bans. Runs in CI (see docs/06-security.md).
# A new license or exception needs a short justification in the commit.

[graph]
# Evaluate the Windows dependencies even on Linux (CI job deny).
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]
all-features = true

[advisories]
# Vulnerabilities are always errors; additionally:
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# All compatible with GPL-3.0-or-later (project license).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
# Slint (ADR 0026): `GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
# LicenseRef-Slint-Software-3.0`; Rerun takes the GPL-3.0-only option, for these crates only and
# never globally. They reach rerun-app.exe alone (CI step "Slint only in rerun-app"), which is
# therefore effectively GPL-3.0-only; the sources stay GPL-3.0-or-later (README).
exceptions = [
  # Under Slint's winit backend (ADR 0026); BSL-1.0 is GPL-compatible. Per crate, not global.
  { crate = "clipboard-win", allow = ["BSL-1.0"] },
  { crate = "error-code", allow = ["BSL-1.0"] },
  { crate = "slint", allow = ["GPL-3.0-only"] },
  { crate = "slint-build", allow = ["GPL-3.0-only"] },
  { crate = "slint-macros", allow = ["GPL-3.0-only"] },
  { crate = "i-slint-backend-selector", allow = ["GPL-3.0-only"] },
  { crate = "i-slint-backend-winit", allow = ["GPL-3.0-only"] },
  { crate = "i-slint-common", allow = ["GPL-3.0-only"] },
  { crate = "i-slint-compiler", allow = ["GPL-3.0-only"] },
  { crate = "i-slint-core", allow = ["GPL-3.0-only"] },
  { crate = "i-slint-core-macros", allow = ["GPL-3.0-only"] },
  { crate = "i-slint-renderer-software", allow = ["GPL-3.0-only"] },
]

[licenses.private]
# Do not check our own crates (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
  # Phase 4 uses rustls for downloads; no OpenSSL dependency.
  { crate = "openssl-sys", reason = "rustls instead of OpenSSL" },
  { crate = "openssl", reason = "rustls instead of OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
